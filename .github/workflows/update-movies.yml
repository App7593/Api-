name: Update movies
on:
  schedule:
    - cron: "30 0 * * *"   # ദിവസവും രാവിലെ 6:00 IST
  workflow_dispatch:        # കൈകൊണ്ട് ഓടിക്കാൻ (Actions ടാബിൽ "Run workflow")

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yt-dlp
        run: pip install -U yt-dlp
      - name: Fetch movies from YouTube
        run: python fetch_movies.py
      - name: Commit changes
        run: |
          git config user.name "movie-bot"
          git config user.email "movie-bot@users.noreply.github.com"
          git add movies.json
          git diff --cached --quiet || git commit -m "Update movies"
          git push
